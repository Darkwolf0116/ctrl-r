/* ===================== BASE ===================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--fuente); background: var(--bg-exterior); color: var(--texto);
  line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100dvh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
svg { display: block; }
h1, h2, h3 { color: var(--titulo); line-height: 1.2; margin: 0 0 .5rem; }
h1 { font-size: 1.45rem; font-weight: 900; }
h2 { font-size: 1.15rem; font-weight: 800; }
h3 { font-size: 1rem; font-weight: 800; }
p { margin: 0 0 .75rem; }
kbd { font-family: var(--mono); background: var(--bg-suave); border: 1px solid var(--borde); border-radius: 6px; padding: 0 5px; }
:focus-visible { outline: 3px solid var(--oro); outline-offset: 3px; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.app {
  max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--bg);
  display: flex; flex-direction: column; position: relative; box-shadow: 0 0 0 1px var(--borde);
}
.vista { flex: 1; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); outline: none; }
body.sin-nav .vista { padding-bottom: calc(100px + env(safe-area-inset-bottom)); } /* deja libre el botón de Sanik */
body.en-juego .vista { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
.entrar { animation: entrar .22s ease-out; }
@keyframes entrar { from { opacity: 0; transform: translateY(8px); } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .2s; }

/* ===================== BARRA SUPERIOR ===================== */
.barra {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top));
  background: var(--superficie); border-bottom: 2px solid var(--borde);
}
.barra[hidden] { display: none; }
.barra-logo { border: 0; background: none; padding: 0; display: flex; border-radius: 10px; }
.barra .logo-img { width: 72px; height: 43px; }
.chip-nivel {
  border: 0; border-radius: 999px; padding: 4px 10px; font-weight: 900; font-size: .8rem;
  background: var(--azul); color: #fff; letter-spacing: .05em; min-height: 30px;
}
.nivel-secundaria .chip-nivel { background: linear-gradient(135deg, #F7C948, #D9A400); color: #1B3C59; }
.barra-espacio { flex: 1; }
.stat {
  border: 0; background: none; display: flex; align-items: center; gap: 3px; font-weight: 900;
  font-size: 1.05rem; padding: 6px 4px; border-radius: 10px; color: var(--texto); min-height: 44px;
}
.anillo-xp { border: 0; background: none; padding: 0; border-radius: 50%; }
.anillo-progreso { transition: stroke-dashoffset .9s ease; }
.anillo-txt { font-size: 14px; font-weight: 900; fill: var(--titulo); }
.punto-red { width: 10px; height: 10px; border-radius: 50%; background: #34A853; flex: none; box-shadow: 0 0 0 2px var(--superficie); }
.punto-red.off { background: #9AA0A6; }
@media (max-width: 359px) {
  .barra { gap: 3px; padding-left: 8px; padding-right: 8px; }
  .barra .logo-img { width: 54px; height: 32px; }
  .stat { font-size: .95rem; padding: 6px 2px; }
  .chip-nivel { padding: 3px 7px; }
}

/* ===================== NAVEGACIÓN INFERIOR ===================== */
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 20;
  display: flex; background: var(--superficie); border-top: 2px solid var(--borde);
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
}
.nav[hidden] { display: none; }
.nav-btn {
  flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--texto-suave); font-weight: 800; font-size: .72rem; min-height: 52px;
}
.nav-ico { font-size: 1.35rem; line-height: 1; filter: grayscale(.6); opacity: .8; }
.nav-btn.activo { color: var(--teal-texto); background: var(--verde-suave); }
.nav-btn.activo .nav-ico { filter: none; opacity: 1; }

/* ===================== BOTONES ===================== */
.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 56px; padding: 0 1.25rem; border: 0; border-radius: 16px;
  font-weight: 800; font-size: 1.2rem; /* texto grande: contraste AA con los verdes institucionales */
  color: #fff; background: var(--verde); box-shadow: 0 4px 0 var(--verde-osc);
  transition: transform .08s, box-shadow .08s, filter .2s; text-align: center; line-height: 1.15;
}
.btn::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .45s;
  background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .45) 0, transparent 65%);
}
.btn:active { transform: translateY(3px) scale(.98); box-shadow: 0 1px 0 var(--verde-osc); }
.btn:active::after { opacity: 1; transition: opacity 0s; }
.btn-teal { background: var(--teal); box-shadow: 0 4px 0 var(--teal-osc); }
.btn-teal:active { box-shadow: 0 1px 0 var(--teal-osc); }
.btn-sec { background: var(--superficie); color: var(--titulo); box-shadow: 0 4px 0 var(--borde), inset 0 0 0 2px var(--borde); }
.btn-sec:active { box-shadow: 0 1px 0 var(--borde), inset 0 0 0 2px var(--borde); }
.btn-rojo { background: #C5221F; box-shadow: 0 4px 0 #8C1816; }
.btn-sm { min-height: 44px; font-size: 1rem; padding: 0 14px; background: var(--verde-osc); box-shadow: 0 3px 0 #1F4D24; }
.btn[disabled], .btn[disabled]:active {
  background: var(--pista); color: var(--texto-suave); box-shadow: 0 4px 0 var(--borde); cursor: not-allowed; transform: none;
}
.btn-bloque { display: flex; width: 100%; }
.btn-link {
  border: 0; background: none; color: var(--teal-texto); font-weight: 800; text-decoration: underline;
  text-underline-offset: 3px; padding: 10px 6px; min-height: 44px;
}
.volver { border: 0; background: none; color: var(--teal-texto); font-weight: 800; padding: 8px 0; margin-bottom: 4px; min-height: 44px; }
.cerrar {
  border: 0; background: none; font-size: 1.35rem; width: 44px; height: 44px; border-radius: 12px;
  color: var(--texto-suave); flex: none; display: grid; place-items: center;
}

/* ===================== COMPONENTES ===================== */
.tarjeta {
  background: var(--superficie); border: 2px solid var(--borde); border-radius: var(--radio);
  padding: 16px; box-shadow: var(--sombra); margin-bottom: 16px;
}
.titulo-sec { margin: 20px 0 10px; }
.sub { color: var(--texto-suave); font-weight: 700; }
.nota { font-size: .88rem; color: var(--texto-suave); background: var(--bg-suave); border-radius: 14px; padding: 10px 12px; font-weight: 600; }
.aviso { background: var(--oro-suave); color: var(--texto); border-radius: 14px; padding: 10px 12px; font-weight: 700; font-size: .9rem; }
.alerta { background: var(--rojo-suave); color: var(--fb-mal-tx); border-radius: 14px; padding: 12px; font-weight: 700; margin-bottom: 12px; }
.barra-prog { height: 12px; border-radius: 999px; background: var(--pista); overflow: hidden; }
.barra-prog span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--verde)); transition: width .6s ease; }
.barra-prog.fina { height: 8px; margin: 6px 0 4px; }
.barra-prog.gruesa { height: 16px; }
.barra-prog.oro span { background: linear-gradient(90deg, #F7C948, #E8A200); }
.chip {
  display: inline-block; border-radius: 999px; padding: 4px 10px; font-size: .78rem; font-weight: 800;
  background: var(--bg-suave); color: var(--texto-suave); border: 1.5px solid var(--borde);
}
.chip.combo { background: var(--oro-suave); color: var(--oro-tx); border-color: var(--oro); }
.lista-limpia { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.vacio { color: var(--texto-suave); font-weight: 700; text-align: center; padding: 12px; }

/* ===================== INICIO ===================== */
.inicio { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-top: env(safe-area-inset-top); }
.logo-grande { width: 180px; height: 107px; }
.inicio-sanik { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sanik.grande { width: 200px; height: 200px; max-width: 56vw; max-height: 56vw; }
.globo {
  position: relative; background: var(--superficie); border: 2px solid var(--borde); border-radius: 18px;
  padding: 12px 16px; font-weight: 700; margin: 0; box-shadow: var(--sombra);
}
.globo::before {
  content: ""; position: absolute; top: -9px; left: 50%; width: 14px; height: 14px; margin-left: -7px;
  background: var(--superficie); border-left: 2px solid var(--borde); border-top: 2px solid var(--borde); transform: rotate(45deg);
}
.niveles { display: grid; gap: 12px; width: 100%; margin-top: 4px; }
.tarjeta-nivel {
  position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-areas: "ico txt" "ico stats";
  align-items: center; column-gap: 14px; row-gap: 4px; text-align: left; width: 100%;
  border: 2px solid var(--borde); border-radius: 20px; padding: 16px; background: var(--superficie);
  box-shadow: 0 5px 0 var(--borde); transition: transform .08s, box-shadow .08s;
}
.tarjeta-nivel:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--borde); }
.tn-ico { grid-area: ico; font-size: 2.3rem; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--verde-suave); }
.nv-secundaria .tn-ico { background: var(--oro-suave); }
.tn-txt { grid-area: txt; display: flex; flex-direction: column; }
.tn-txt b { font-size: 1.25rem; color: var(--titulo); }
.tn-txt small { color: var(--texto-suave); font-weight: 700; }
.tn-stats { grid-area: stats; font-weight: 800; font-size: .88rem; color: var(--texto-suave); }
.badge-sec {
  position: absolute; top: 10px; right: 10px; background: linear-gradient(135deg, #F7C948, #D9A400); color: #1B3C59;
  font-weight: 900; font-size: .7rem; padding: 3px 8px; border-radius: 999px; letter-spacing: .08em; z-index: 1;
}
.nota-offline { font-size: .85rem; color: var(--texto-suave); font-weight: 700; margin: 4px 0 0; }
.inicio-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; }

/* ===================== MATERIAS ===================== */
.saludo { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.saludo .sanik { width: 72px; height: 72px; flex: none; }
.saludo h1 { margin: 0; }
.saludo p { margin: 0; color: var(--texto-suave); font-weight: 600; font-size: .92rem; }
.meta-cab { display: flex; justify-content: space-between; align-items: center; font-weight: 800; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
.meta small { display: block; margin-top: 8px; color: var(--texto-suave); font-weight: 700; }
.grid-materias { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tarjeta-materia {
  position: relative; border: 0; border-radius: 20px; padding: 16px 10px 14px; background: var(--c); color: #fff;
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-height: 172px;
  box-shadow: 0 5px 0 rgba(0, 0, 0, .25), var(--sombra); transition: transform .1s, filter .2s; overflow: hidden;
}
.tarjeta-materia::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(135deg, rgba(255, 255, 255, .25), transparent 45%);
}
.tarjeta-materia:active { transform: translateY(3px) scale(.98); }
@media (hover: hover) { .tarjeta-materia:hover, .tarjeta-nivel:hover { filter: brightness(1.06); } }
.tm-anillo .anillo-txt { font-size: 26px; }
.tm-nombre { font-weight: 900; font-size: 1rem; line-height: 1.2; }
.tm-prog { font-size: .8rem; font-weight: 700; opacity: .95; }
.nota-cnb { margin-top: 16px; }

/* ===================== MATERIA ===================== */
.banner-materia { display: flex; gap: 14px; align-items: flex-start; background: var(--c); color: #fff; border-radius: 20px; padding: 18px; box-shadow: var(--sombra); }
.banner-materia h1 { color: #fff; font-size: 1.3rem; margin-bottom: 6px; }
.banner-materia p { margin: 0; font-size: .92rem; opacity: .95; }
.bm-ico { font-size: 2.6rem; line-height: 1; }
.stats-materia { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 2px; font-weight: 800; font-size: .9rem; color: var(--texto-suave); }
.meds { display: flex; gap: 4px; margin-left: auto; }
.med-mini { font-size: 1.3rem; }
.med-mini.off { filter: grayscale(1); opacity: .35; }
.lista-dif { display: grid; gap: 10px; margin-bottom: 16px; }
.fila-dif { display: flex; align-items: center; gap: 12px; background: var(--superficie); border: 2px solid var(--borde); border-radius: 16px; padding: 12px; }
.fila-dif.bloqueada { background: var(--bg-suave); }
.fila-dif.bloqueada .fd-info { opacity: .8; }
.fd-ico { font-size: 1.8rem; }
.fd-info { flex: 1; min-width: 0; }
.fd-info b { color: var(--titulo); }
.fd-info small { color: var(--texto-suave); font-weight: 700; font-size: .8rem; }

/* ===================== JUEGO ===================== */
.juego { display: flex; flex-direction: column; gap: 12px; min-height: calc(100vh - 40px); min-height: calc(100dvh - 40px); }
.juego.con-fb { padding-bottom: 230px; }
.juego-top { display: flex; align-items: center; gap: 10px; padding-top: env(safe-area-inset-top); }
.juego-top .barra-prog { flex: 1; }
.juego-top .barra-prog span { background: linear-gradient(90deg, var(--c), var(--verde)); }
.vidas-juego { font-weight: 900; color: #D93025; min-width: 44px; text-align: right; white-space: nowrap; }
.juego-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.juego-pregunta { display: flex; align-items: flex-end; gap: 10px; }
.juego-pregunta .sanik { width: 84px; height: 84px; flex: none; }
.pregunta {
  position: relative; flex: 1; font-size: 1.2rem; font-weight: 800; background: var(--superficie); color: var(--texto);
  border: 2px solid var(--borde); border-radius: 18px; padding: 14px; margin: 0 0 18px;
}
.pregunta::before {
  content: ""; position: absolute; left: -9px; bottom: 18px; width: 14px; height: 14px;
  background: var(--superficie); border-left: 2px solid var(--borde); border-bottom: 2px solid var(--borde); transform: rotate(45deg);
}
.visual { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 4px 0; }
.visual.emoji { font-size: 2.1rem; letter-spacing: .1em; flex-wrap: wrap; text-align: center; line-height: 1.4; }
.muestra { width: 64px; height: 64px; border-radius: 50%; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .15), 0 0 0 3px var(--superficie), 0 0 0 5px var(--borde); }
.visual .mas { font-weight: 900; font-size: 1.6rem; color: var(--texto-suave); }
.opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opciones.lista { grid-template-columns: 1fr; }
.opcion {
  display: flex; align-items: center; gap: 10px; text-align: left; min-height: 60px; padding: 10px 12px;
  border: 2px solid var(--borde); border-radius: 16px; background: var(--superficie); box-shadow: 0 4px 0 var(--borde);
  font-weight: 700; font-size: 1.05rem; transition: transform .08s, border-color .15s, background-color .15s; color: var(--texto);
}
.opcion:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--borde); }
.op-letra {
  flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--borde); display: grid; place-items: center;
  font-size: .8rem; font-weight: 900; color: var(--texto-suave);
}
.op-txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.op-txt.op-emoji { font-size: 1.9rem; line-height: 1; }
.opcion[aria-pressed="true"] { border-color: #1565C0; background: var(--azul-suave); box-shadow: 0 4px 0 #1565C0; }
.opcion[aria-pressed="true"] .op-letra { border-color: #1565C0; color: #1565C0; }
.opcion.correcta { border-color: var(--verde); background: var(--verde-suave); box-shadow: 0 4px 0 var(--verde); opacity: 1; }
.opcion.correcta .op-letra { border-color: var(--verde); color: var(--verde); }
.opcion.incorrecta { border-color: #D93025; background: var(--rojo-suave); box-shadow: 0 4px 0 #D93025; animation: sacudir .35s; }
.opcion:disabled { cursor: default; }
.opcion:disabled:not(.correcta):not(.incorrecta) { opacity: .45; }
@keyframes sacudir { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.juego-acciones { display: grid; grid-template-columns: auto 1fr; gap: 10px; margin-top: auto; padding-bottom: env(safe-area-inset-bottom); }
.juego-acciones .btn-sec { font-size: 1rem; }
.feedback {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 30;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0;
  animation: subir .25s ease-out; box-shadow: 0 -6px 24px rgba(0, 0, 0, .15);
}
.feedback[hidden] { display: none; }
.feedback.ok { background: var(--fb-ok-bg); color: var(--fb-ok-tx); }
.feedback.mal { background: var(--fb-mal-bg); color: var(--fb-mal-tx); }
.feedback p { margin-bottom: 10px; }
.fb-cab { display: flex; align-items: center; gap: 8px; font-size: 1.25rem; margin-bottom: 6px; flex-wrap: wrap; }
.fb-pts { margin-left: auto; font-weight: 900; color: var(--oro-tx); background: var(--oro-suave); border-radius: 999px; padding: 2px 10px; font-size: 1rem; }
@keyframes subir { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }

/* ===================== RESULTADOS ===================== */
.resultados { text-align: center; }
.res-sanik { display: flex; justify-content: center; }
.res-sub { color: var(--texto-suave); font-weight: 700; }
.res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.res-tile { background: var(--superficie); border: 2px solid var(--borde); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; }
.res-tile b { font-size: 1.5rem; color: var(--titulo); font-family: var(--mono); }
.res-tile small { color: var(--texto-suave); font-weight: 800; }
.res-extra { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 8px; }
.res-acciones { display: grid; gap: 14px; margin-top: 14px; }
.res-medallas { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 8px 0; }

/* ===================== BANCO ===================== */
.banco-cifra { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.banco-cifra b { font-size: 2.2rem; color: var(--titulo); font-family: var(--mono); }
.banco-cifra span { color: var(--texto-suave); font-weight: 800; }
.banco-eq { margin: 10px 0 4px; font-weight: 700; }
.banco-regla { font-size: .88rem; color: var(--texto-suave); font-weight: 700; }
.banco-hoy { display: block; margin-top: 10px; color: var(--texto-suave); font-weight: 700; text-align: center; }
.banco-resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.banco-resumen div { background: var(--bg-suave); border-radius: 14px; padding: 10px 4px; text-align: center; display: flex; flex-direction: column; }
.banco-resumen b { font-family: var(--mono); font-size: 1.1rem; color: var(--titulo); }
.banco-resumen small { font-weight: 800; color: var(--texto-suave); font-size: .75rem; }
.comprobante { background: var(--superficie); border: 2px dashed var(--teal); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; }
.comprobante small { color: var(--texto-suave); font-weight: 700; }
.cp-codigo { font-family: var(--mono); font-weight: 800; font-size: 1.05rem; letter-spacing: .04em; color: var(--titulo); overflow-wrap: anywhere; }
.historial li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: var(--superficie); border: 1.5px solid var(--borde); border-radius: 12px; font-size: .88rem; }
.h-txt { min-width: 0; }
.h-txt small { display: block; color: var(--texto-suave); font-weight: 700; }
.h-pts { font-family: var(--mono); font-weight: 800; white-space: nowrap; }
.h-pts.neg { color: #C5221F; }
.h-pts.pos { color: var(--teal-texto); }
.verificar summary { font-weight: 800; cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--titulo); }
.verif-res { margin-top: 8px; font-weight: 800; }
.verif-res.ok { color: var(--teal-texto); }
.verif-res.mal { color: #C5221F; }
.codigo-grande {
  font-family: var(--mono); font-size: 1.3rem; font-weight: 900; letter-spacing: .05em; background: var(--bg-suave);
  border: 2px dashed var(--teal); border-radius: 14px; padding: 12px; margin: 10px 0; color: var(--titulo);
  overflow-wrap: anywhere; -webkit-user-select: all; user-select: all;
}

/* ===================== FORMULARIOS ===================== */
.campo { display: grid; gap: 6px; margin: 0 0 14px; }
.campo label, .etq { font-weight: 800; font-size: .92rem; }
.campo small { color: var(--texto-suave); font-weight: 700; }
input[type="text"], input:not([type]), textarea, select {
  width: 100%; border: 2px solid var(--borde); border-radius: 12px; padding: 12px; background: var(--bg);
  min-height: 48px; font-size: 1rem;
}
textarea { min-height: 110px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px rgba(58, 140, 117, .3); }
.fila-form { display: flex; gap: 8px; align-items: center; }
.fila-form input { flex: 1; min-width: 0; }
.ajuste { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1.5px solid var(--borde); font-weight: 800; cursor: pointer; }
.interruptor {
  -webkit-appearance: none; appearance: none; width: 52px; height: 30px; border-radius: 999px; background: var(--pista);
  position: relative; cursor: pointer; flex: none; transition: background .2s; border: 0; margin: 0;
}
.interruptor::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s;
}
.interruptor:checked { background: var(--verde); }
.interruptor:checked::after { transform: translateX(22px); }
.segmentos { display: flex; gap: 6px; flex-wrap: wrap; }
.segmentos label { position: relative; }
.segmentos input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.segmentos span { display: flex; align-items: center; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--borde); font-weight: 800; min-height: 44px; }
.segmentos input:checked + span { border-color: var(--teal); background: var(--verde-suave); color: var(--teal-texto); }
.segmentos input:focus-visible + span { outline: 3px solid var(--oro); outline-offset: 2px; }
.zona-peligro { border-color: #F2B8B5; }
.estrellas { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 2px; }
.estrellas input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.estrellas label { font-size: 2rem; cursor: pointer; filter: grayscale(1); opacity: .4; min-width: 44px; text-align: center; line-height: 1.3; }
.estrellas input:checked ~ label { filter: none; opacity: 1; }
.estrellas input:focus-visible + label { outline: 3px solid var(--oro); border-radius: 8px; }
.resena { background: var(--superficie); border: 2px solid var(--borde); border-radius: 14px; padding: 12px; }
.resena p { margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.resena small { color: var(--texto-suave); font-weight: 700; }
.resena-acc { display: flex; gap: 8px; justify-content: flex-end; }

/* ===================== MEDALLAS / COLONIA / MENÚ ===================== */
.grid-medallas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.grid-medallas.especiales { grid-template-columns: repeat(3, 1fr); }
.medalla {
  border: 2px solid var(--borde); border-radius: 16px; background: var(--superficie); padding: 10px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 92px;
  font-size: .72rem; font-weight: 800; color: var(--texto-suave); text-align: center; line-height: 1.15;
}
.md-ico { font-size: 1.9rem; line-height: 1; }
.medalla.off .md-ico { filter: grayscale(1); opacity: .35; }
.medalla:not(.off) { color: var(--titulo); }
.medalla:not(.off).r-bronce { border-color: #D4A276; background: linear-gradient(160deg, var(--superficie), rgba(212, 162, 118, .18)); }
.medalla:not(.off).r-plata { border-color: #AEB9C4; background: linear-gradient(160deg, var(--superficie), rgba(174, 185, 196, .25)); }
.medalla:not(.off).r-oro { border-color: var(--oro); background: linear-gradient(160deg, var(--superficie), rgba(242, 183, 5, .2)); }
.medalla:not(.off).r-diamante { border-color: #7FC8F8; background: linear-gradient(160deg, var(--superficie), rgba(127, 200, 248, .25)); }
.medalla:not(.off).r-especial { border-color: #B39DDB; background: linear-gradient(160deg, var(--superficie), rgba(179, 157, 219, .22)); }
.md-grande { font-size: 4rem; line-height: 1.1; }
.ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ranking li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--superficie); border: 1.5px solid var(--borde); font-weight: 700; }
.rk-pos { width: 28px; text-align: center; font-weight: 900; color: var(--texto-suave); flex: none; }
.rk-nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk-xp { font-family: var(--mono); font-weight: 800; font-size: .9rem; white-space: nowrap; }
.ranking li.zona-sube .rk-pos { color: var(--teal-texto); }
.ranking li.zona-baja .rk-pos { color: #C5221F; }
.ranking li.tu { border-color: var(--oro); background: var(--oro-suave); box-shadow: 0 3px 0 var(--oro); }
.menu { display: grid; gap: 10px; }
.menu-item {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; padding: 14px;
  border: 2px solid var(--borde); border-radius: 16px; background: var(--superficie); box-shadow: 0 4px 0 var(--borde); color: var(--texto);
}
.menu-item:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--borde); }
.mi-ico { font-size: 1.6rem; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--bg-suave); flex: none; }
.mi-txt { display: flex; flex-direction: column; }
.mi-txt b { color: var(--titulo); }
.mi-txt small { color: var(--texto-suave); font-weight: 700; }
.item-tienda { display: flex; gap: 12px; align-items: center; }
.it-ico { font-size: 2.2rem; }
.it-info { flex: 1; min-width: 0; }
.it-info p { margin: 2px 0 0; font-size: .9rem; color: var(--texto-suave); font-weight: 600; }
.precio { font-family: var(--mono); font-weight: 800; color: var(--oro-tx); }

/* ===================== SOBRE CTRL+R ===================== */
.hero-sobre { text-align: center; }
.hero-sobre .sanik { margin: 0 auto; width: 140px; height: 140px; }
.lista-check { padding: 0; margin: 0 0 12px; list-style: none; display: grid; gap: 10px; }
.lista-check li { padding-left: 28px; position: relative; }
.lista-check li::before { content: "✔"; position: absolute; left: 4px; color: var(--verde); font-weight: 900; }
.lista-areas { padding: 0; margin: 0; list-style: none; display: grid; gap: 10px; }
.lista-areas li { border-left: 6px solid var(--c); padding: 6px 0 6px 12px; }
.lista-areas b { display: block; color: var(--titulo); }
.contacto { margin: 0; }
.contacto dt { font-weight: 800; color: var(--titulo); }
.contacto dd { margin: 0 0 10px; }
.destacado { border-color: var(--teal); background: linear-gradient(160deg, var(--superficie), var(--verde-suave)); }

/* ===================== MODALES / TOASTS / ASISTENTE ===================== */
.modal-fondo { position: fixed; inset: 0; z-index: 50; background: rgba(10, 20, 30, .55); display: flex; align-items: center; justify-content: center; padding: 16px; animation: aparecer .2s; }
.modal-fondo.con-hoja { align-items: flex-end; padding: 0; }
.modal {
  background: var(--superficie); color: var(--texto); border-radius: 22px; padding: 20px; width: 100%; max-width: 420px;
  max-height: calc(100vh - 32px); overflow: auto; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); animation: emerger .22s ease-out;
}
.modal .sanik { width: 120px; height: 120px; margin: 0 auto 6px; }
.modal h2 { margin-bottom: 6px; }
.modal .btn { margin-top: 10px; }
.modal-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-botones .btn { padding: 0 10px; font-size: 1.05rem; }
.modal-botones .btn:not(.btn-sec):not(.btn-rojo) { background: var(--verde-osc); box-shadow: 0 4px 0 #1F4D24; }
.modal.hoja { max-width: 520px; border-radius: 22px 22px 0 0; text-align: left; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
@keyframes aparecer { from { opacity: 0; } }
@keyframes emerger { from { transform: translateY(16px) scale(.97); opacity: 0; } }
.toasts {
  position: fixed; top: calc(64px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 488px; z-index: 80; display: grid; gap: 8px; pointer-events: none;
}
.toast { background: var(--azul); color: #fff; padding: 12px 16px; border-radius: 14px; font-weight: 800; box-shadow: 0 8px 20px rgba(0, 0, 0, .2); animation: bajar .25s ease-out; font-size: .95rem; transition: opacity .35s, transform .35s; }
.toast.ok { background: #2E6B33; }
.toast.mal { background: #B3261E; }
.toast.oro { background: var(--oro); color: #1B3C59; }
.toast.sale { opacity: 0; transform: translateY(-8px); }
@keyframes bajar { from { opacity: 0; transform: translateY(-10px); } }
.fab {
  position: fixed; right: max(16px, calc(50vw - 244px)); bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 25;
  width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--superficie); background: var(--verde-suave);
  box-shadow: 0 6px 16px rgba(27, 60, 89, .3); padding: 2px;
}
.fab[hidden] { display: none; }
.fab .sanik { width: 100%; height: 100%; }
body.sin-nav .fab { bottom: calc(20px + env(safe-area-inset-bottom)); }
.asistente { display: flex; flex-direction: column; height: min(80vh, 640px); }
.asis-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.asis-cab .sanik { width: 52px; height: 52px; margin: 0; }
.asis-cab div { flex: 1; display: flex; flex-direction: column; }
.asis-cab b { color: var(--titulo); font-size: 1.1rem; }
.asis-cab small { color: var(--texto-suave); font-weight: 700; }
.asis-log { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 2px; }
.msg { max-width: 86%; padding: 10px 12px; border-radius: 16px; font-size: .95rem; line-height: 1.4; }
.msg.de-sanik { background: var(--verde-suave); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.de-yo { background: var(--azul-suave); align-self: flex-end; border-bottom-right-radius: 4px; }
.asis-chips { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0; scrollbar-width: none; }
.chip-btn { flex: none; border: 2px solid var(--borde); background: var(--superficie); border-radius: 999px; padding: 8px 12px; font-weight: 800; font-size: .85rem; min-height: 40px; white-space: nowrap; }
.asis-form { display: flex; gap: 8px; }
.asis-form input { flex: 1; min-width: 0; }

/* ===================== EFECTOS ===================== */
.confeti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confeti i { position: absolute; top: -14px; width: 8px; height: 13px; border-radius: 2px; animation: caer 1.6s cubic-bezier(.2, .6, .4, 1) forwards; }
@keyframes caer { to { transform: translate(var(--x), 105vh) rotate(var(--giro)); } }
.flotante {
  position: fixed; transform: translate(-50%, 0); font-weight: 900; color: var(--oro); font-size: 1.6rem;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .2); pointer-events: none; z-index: 70; animation: flotar 1.1s ease-out forwards;
}
@keyframes flotar { to { transform: translate(-50%, -70px); opacity: 0; } }

/* ===================== SANIK (SVG animado) ===================== */
.sanik { overflow: visible; }
.sanik g, .sanik path, .sanik ellipse, .sanik circle, .sanik text { transform-box: fill-box; }
.sanik .s-sombra { fill: rgba(0, 0, 0, .12); }
.sanik .s-iris { fill: #10283B; transition: fill .3s; }
.s-todo { transform-origin: 50% 100%; animation: s-balanceo 3.4s ease-in-out infinite; }
.s-ojos { transform-origin: 50% 50%; animation: s-parpadeo 4s infinite; }
.s-pupilas { transform-origin: 50% 50%; transition: transform .3s; }
.s-cabeza { transform-origin: 50% 100%; transition: transform .3s; }
.s-antenas { transform-origin: 50% 100%; animation: s-antenas 3s ease-in-out infinite; }
.s-brazo-saludo { transform-origin: 0% 100%; animation: s-saludo 2.6s ease-in-out infinite; transition: opacity .2s; }
.s-aura { transform-origin: 50% 50%; }
.s-aura, .s-burbuja, .s-zzz, .s-lagrima, .s-corona, .s-boca-triste, .s-brazo-pensar { opacity: 0; transition: opacity .25s; }
.s-gorra { display: none; }
.nivel-secundaria .s-gorra { display: inline; }
.s-zzz text { font-weight: 900; fill: var(--teal-texto); font-size: 16px; }
.s-burbuja-txt { font-weight: 900; font-size: 20px; fill: #1B3C59; }
.is-think .s-burbuja { opacity: 1; }
.is-think .s-brazo-saludo { opacity: 0; animation: none; }
.is-think .s-brazo-pensar { opacity: 1; }
.is-think .s-pupilas { transform: translate(1px, -3px); }
.is-think .s-cabeza { transform: rotate(-5deg); }
.is-celebrate .s-todo { transform-origin: 50% 50%; animation: s-festejo .9s ease-out; }
.is-celebrate .s-brazo-saludo { animation: s-saludo .35s ease-in-out infinite; }
.is-sad .s-boca-feliz { opacity: 0; }
.is-sad .s-boca-triste { opacity: 1; }
.is-sad .s-lagrima { opacity: 1; animation: s-lagrima 1.2s ease-in infinite; }
.is-sad .s-cabeza { transform: translateY(4px) rotate(5deg); }
.is-sad .s-todo { animation: s-rebote .8s ease-out; }
.is-sad .s-brazo-saludo { animation: none; transform: rotate(50deg); }
.is-sad .s-antenas { animation: none; transform: scaleY(.85) rotate(4deg); }
.is-levelup .s-aura, .is-milestone .s-aura { opacity: 1; animation: s-pulso 1s ease-in-out infinite; }
.is-levelup .s-iris { fill: #F2B705; }
.is-levelup .s-todo { animation: s-crecer 1.6s ease-in-out; }
.is-milestone .s-corona { opacity: 1; }
.is-milestone .s-gorra { opacity: 0; }
.is-milestone .s-todo { transform-origin: 50% 50%; animation: s-festejo 1.1s ease-out 2; }
.is-sleep .s-ojos { animation: none; transform: scaleY(.12); }
.is-sleep .s-zzz { opacity: 1; }
.is-sleep .s-zzz text { animation: s-zzz 2.4s ease-in-out infinite; }
.is-sleep .s-zzz text:nth-child(2) { animation-delay: .4s; }
.is-sleep .s-zzz text:nth-child(3) { animation-delay: .8s; }
.is-sleep .s-todo { animation: s-respirar 4s ease-in-out infinite; }
.is-sleep .s-brazo-saludo { animation: none; }
@keyframes s-balanceo { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes s-parpadeo { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes s-saludo { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }
@keyframes s-antenas { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(3deg); } }
@keyframes s-festejo { 0% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-28%) rotate(180deg); } 70% { transform: translateY(-10%) rotate(360deg); } 100% { transform: translateY(0) rotate(360deg); } }
@keyframes s-rebote { 0% { transform: translateY(0); } 30% { transform: translateY(5%); } 60% { transform: translateY(-2%); } 100% { transform: translateY(0); } }
@keyframes s-lagrima { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
@keyframes s-pulso { 0%, 100% { transform: scale(.92); opacity: .6; } 50% { transform: scale(1.05); opacity: 1; } }
@keyframes s-crecer { 0%, 100% { transform: scale(1); } 30%, 70% { transform: scale(1.1); } }
@keyframes s-respirar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03, .98); } }
@keyframes s-zzz { 0% { opacity: 0; transform: translate(0, 4px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translate(4px, -6px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>

  // Completa los campos que falten con los valores por defecto sin perder lo guardado.

    const esObj = (x) => x && typeof x === 'object' && !Array.isArray(x);
    if (datos === undefined || datos === null) return base;
    if (!esObj(base) || !esObj(datos)) return (Array.isArray(base) === Array.isArray(datos) && typeof base === typeof datos) || base === null ? datos : base;
    const r = Object.assign({}, datos);

        const st = migrar(obj.datos, nv);
        if (obj.firma !== firmar(JSON.stringify(obj.datos))) st.integridad = 'alterada';
        return st;

      const st = migrar(obj, nv);
      st.integridad = 'alterada'; // datos sin firma: no se puede confiar en ellos para canjear

    S.xpTotal += xp; S.colonia.xp += xp; S.meta.actual += xp;

      if (AC) { try { this.ctx = new AC(); } catch (e) { this.ctx = null; } }

      o.type = tipo || 'sine';

      g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);

      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.03);

  const ESTADOS_SANIK = ['think', 'celebrate', 'sad', 'levelup', 'milestone', 'sleep'];
  function sanik(estado, ms) {
    $$('#vista .sanik.principal, .modal .sanik.principal').forEach((el) => {
      ESTADOS_SANIK.forEach((c) => el.classList.remove('is-' + c));
      clearTimeout(el._t);
      if (!estado || estado === 'idle') return;
      void el.getBoundingClientRect(); // reinicia la animación si se repite el estado
      el.classList.add('is-' + estado);
      if (ms) el._t = setTimeout(() => el.classList.remove('is-' + estado), ms);
    });
  }
  let tInactivo = null;
  function actividad() {
    clearTimeout(tInactivo);
    $$('.sanik.is-sleep').forEach((s) => s.classList.remove('is-sleep'));
    tInactivo = setTimeout(() => $$('#vista .sanik.principal').forEach((s) => s.classList.add('is-sleep')), CONFIG.INACTIVIDAD_MS);
  }
  ['pointerdown', 'keydown', 'scroll'].forEach((ev) => document.addEventListener(ev, actividad, { passive: true }));

  /* ===================== EFECTOS ===================== */
  function confeti() {
    if (reducirMov()) return;
    const colores = ['#3E8C43', '#3A8C75', '#1B3C59', '#F2B705', '#C2185B', '#1565C0', '#B45309'];
    const cont = document.createElement('div');
    cont.className = 'confeti';
    cont.setAttribute('aria-hidden', 'true');
    let h = '';
    for (let i = 0; i < 28; i++) {
      h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + colores[i % colores.length] +
        ';animation-delay:' + (Math.random() * 0.25).toFixed(2) + 's;--giro:' + Math.round(Math.random() * 720 - 360) +
        'deg;--x:' + Math.round(Math.random() * 80 - 40) + 'px"></i>';
    }
    cont.innerHTML = h;
    document.body.appendChild(cont);
    setTimeout(() => cont.remove(), 1900);
  }
  function flotar(texto, el) {
    if (!el) return;
    const r = el.getBoundingClientRect(), f = document.createElement('div');
    f.className = 'flotante';
    f.textContent = texto;
    f.style.left = (r.left + r.width / 2) + 'px';
    f.style.top = r.top + 'px';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1100);
  }
  function toast(msg, tipo) {
    const cont = $('#toasts');
    while (cont.children.length >= 3) cont.firstChild.remove();
    const t = document.createElement('div');
    t.className = 'toast ' + (tipo || '');
    t.textContent = msg;
    cont.appendChild(t);
    setTimeout(() => { t.classList.add('sale'); setTimeout(() => t.remove(), 400); }, 3400);
  }
  function procesarEventos() {

      if (e.tipo === 'nivel') { Sonido.nivel(); sanik('levelup', 1800); toast('⭐ ¡Sanik subió al nivel ' + e.n + '!', 'oro'); }
      else if (e.tipo === 'meta') { Sonido.racha(); confeti(); toast('🎯 ¡Meta diaria cumplida! +' + CONFIG.BONO_META + ' XP extra', 'ok'); }
      else if (e.tipo === 'medalla') {
        setTimeout(() => Sonido.medalla(), 250);

        if (!(L && L.medallas.indexOf(e.m) >= 0)) toast(e.m.icono + ' Nueva medalla: ' + e.m.nombreLargo, 'oro');

  /* ===================== PIEZAS DE INTERFAZ ===================== */
  function anillo(pct, texto, tam, grosor, color, pista) {
    tam = tam || 40; grosor = grosor || 4;
    const r = (tam - grosor) / 2, c = 2 * Math.PI * r, h = tam / 2;
    return '<svg class="anillo" viewBox="0 0 ' + tam + ' ' + tam + '" width="' + tam + '" height="' + tam + '" aria-hidden="true">' +
      // var() no funciona en atributos de presentación SVG: los colores van en style.
      '<circle cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" style="stroke:' + (pista || 'var(--pista)') + '" stroke-width="' + grosor + '"/>' +
      '<circle class="anillo-progreso" cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke-width="' + grosor +
      '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" style="stroke:' + (color || 'var(--oro)') + ';stroke-dashoffset:' + (c * (1 - pct / 100)).toFixed(2) + '" transform="rotate(-90 ' + h + ' ' + h + ')"/>' +
      '<text x="50%" y="50%" dy=".35em" text-anchor="middle" class="anillo-txt">' + texto + '</text></svg>';
  }
  const FORMAS = {
    circulo: '<circle cx="50" cy="50" r="40"/>',
    triangulo: '<polygon points="50,10 92,88 8,88"/>',

  function visualHTML(v) {

    }
    if (v.indexOf('forma:') === 0) {
      return '<div class="visual" aria-hidden="true"><svg viewBox="0 0 100 100" width="104" height="104" style="fill:var(--c)">' + (FORMAS[v.slice(6)] || '') + '</svg></div>';
    }

  const VISTAS = {
    inicio: vInicio, materias: vMaterias, materia: vMateria, juego: vJuego, resultados: vResultados, banco: vBanco,
    medallas: vMedallas, colonia: vColonia, mas: vMas, tienda: vTienda, ajustes: vAjustes, sobre: vSobre, resenas: vResenas
  };
  const VISTAS_SIN_NIVEL = ['inicio', 'sobre', 'resenas'];

  /* ===================== ROUTER ===================== */
  let vista = 'inicio', params = {}, eventoInstalar = null, ultimoPctXP = null;
  function ir(v, p, opc) {
    p = p || {}; opc = opc || {};
    if (VISTAS_SIN_NIVEL.indexOf(v) < 0 && !S) v = 'inicio';
    if (v === 'inicio') salirNivel();
    vista = v; params = p;
    const st = { v, p };
    if (opc.reemplazar) history.replaceState(st, ''); else history.pushState(st, '');
    pintar(true);
  }
  function pintar(animar) {
    const hacer = () => {
      $('#vista').innerHTML = VISTAS[vista]();
      pintarBarra();
      window.scrollTo(0, 0);
      despuesDePintar();
    };
    if (animar && document.startViewTransition && !reducirMov() && document.visibilityState === 'visible') {
      // Si la transición se interrumpe (otra navegación, pestaña oculta), sus promesas se rechazan: se ignoran.
      const t = document.startViewTransition(hacer);
      const nada = () => {};
      t.ready.catch(nada); t.finished.catch(nada); t.updateCallbackDone.catch(nada);
      return;
    }
    hacer();
    if (animar && !reducirMov()) { const el = $('#vista'); el.classList.remove('entrar'); void el.offsetWidth; el.classList.add('entrar'); }
  }
  function pintarBarra() {
    const barra = $('#barra'), nav = $('#nav'), fab = $('#fab');
    const conBarra = !!S && ['inicio', 'juego', 'resultados'].indexOf(vista) < 0;
    barra.hidden = !conBarra; nav.hidden = !conBarra;
    document.body.classList.toggle('sin-nav', !conBarra);
    document.body.classList.toggle('en-juego', vista === 'juego');
    fab.hidden = vista === 'juego';
    if (!fab.firstChild) fab.innerHTML = sanikSVG('');
    if (!conBarra) return;
    actualizarVidas();
    const nx = nivelXP(S.xpTotal), en = navigator.onLine;
    barra.innerHTML =
      '<button class="barra-logo" data-a="ir" data-v="materias" aria-label="Ir a Aprender"><span class="logo-img" role="img" aria-label="CTRL+R"></span></button>' +
      '<button class="chip-nivel" data-a="ir" data-v="inicio" aria-label="Nivel ' + NIVELES[nivel].nombre + '. Cambiar de nivel">' + NIVELES[nivel].corto + '</button>' +
      '<span class="barra-espacio"></span>' +
      '<button class="stat" data-a="info" data-k="racha" aria-label="Racha de ' + S.racha.actual + ' días"><span aria-hidden="true">🔥</span><b>' + S.racha.actual + '</b></button>' +
      '<button class="stat" data-a="info" data-k="vidas" aria-label="' + S.vidas.n + ' vidas"><span aria-hidden="true">❤️</span><b>' + S.vidas.n + '</b></button>' +
      '<button class="anillo-xp" data-a="info" data-k="xp" aria-label="Sanik nivel ' + nx.n + ', ' + nx.pct + ' por ciento hacia el siguiente">' + anillo(ultimoPctXP === null ? nx.pct : ultimoPctXP, nx.n, 40, 4) + '</button>' +
      '<span class="punto-red ' + (en ? 'on' : 'off') + '" role="img" aria-label="' + (en ? 'Con internet' : 'Sin internet') + '" title="' + (en ? 'Con internet' : 'Sin internet: tu progreso se guarda en este teléfono') + '"></span>';

    if (ultimoPctXP !== null && ultimoPctXP !== nx.pct) {
      const c = $('.anillo-xp .anillo-progreso'), circ = parseFloat(c.getAttribute('stroke-dasharray'));
      requestAnimationFrame(() => requestAnimationFrame(() => { c.style.strokeDashoffset = (circ * (1 - nx.pct / 100)).toFixed(2); }));
    }
    ultimoPctXP = nx.pct;
    const activo = (t) => vista === t || (t === 'materias' && vista === 'materia') || (t === 'mas' && ['tienda', 'ajustes', 'sobre', 'resenas'].indexOf(vista) >= 0);
    nav.innerHTML = [['materias', '🏠', 'Aprender'], ['banco', '🏦', 'Banco'], ['medallas', '🏅', 'Medallas'], ['colonia', '🐜', 'Colonia'], ['mas', '☰', 'Más']]
      .map((t) => '<button class="nav-btn' + (activo(t[0]) ? ' activo" aria-current="page' : '') + '" data-a="ir" data-v="' + t[0] + '"><span class="nav-ico" aria-hidden="true">' + t[1] + '</span><span>' + t[2] + '</span></button>').join('');
  }
  function despuesDePintar() {
    actividad();
    $('#vista').focus({ preventScroll: true });

      setTimeout(procesarEventos, 500);
    }

  window.addEventListener('popstate', (e) => {

    if (!VISTAS[v] || (VISTAS_SIN_NIVEL.indexOf(v) < 0 && !S)) v = 'inicio';
    if (v === 'inicio') salirNivel();
    vista = v; params = st.p || {};

  /* ===================== NIVELES ===================== */
  function entrarNivel(nv) {
    if (S && S.nivel !== nv) guardar(true);
    nivel = nv;

    ses.combo = 0; ses.mejorCombo = 0; ses.tiempos = []; ses.dificilesSeguidas = 0;
    ultimoPctXP = null;

    renovarDia();
    actualizarVidas();
    const r = { racha: revisarRacha(), colonia: revisarColonia() };
    guardar(true);
    return r;
  }
  function salirNivel() {
    if (!S) return;

    S = null; nivel = null; L = null;
    document.body.classList.remove('nivel-secundaria');

  function entrarYMostrar(nv, mat) {
    const r = entrarNivel(nv);

      if (!S) return;
      if (r.racha && r.racha.tipo === 'perdida') { sanik('sad', 2200); toast('💔 Se terminó tu racha de ' + r.racha.dias + ' días. ¡Hoy empieza una nueva!', 'mal'); }

      if (r.colonia) {
        const liga = LIGAS[S.colonia.liga].nombre;
        toast(r.colonia.cambio > 0 ? '🏆 ¡Subiste a la liga ' + liga + '!' : r.colonia.cambio < 0 ? 'Bajaste a la liga ' + liga + '. ¡Esta semana la recuperas!' : 'Terminaste la semana en el puesto ' + r.colonia.pos + ' de la colonia.', r.colonia.cambio > 0 ? 'oro' : '');
      }
      if (S.integridad === 'alterada') toast('⚠️ Detectamos cambios manuales en el progreso. Los canjes de este nivel están bloqueados.', 'mal');
    }, 350);
  }

  /* ===================== LECCIÓN ===================== */
  function jugar(mat, dif, modo) {
    actualizarVidas();
    modo = modo || 'normal';
    if (modo === 'normal') {
      if (!desbloqueada(mat, dif)) { toast('🔒 Primero domina más preguntas del nivel anterior'); return; }
      if (S.vidas.n <= 0) { modalSinVidas(mat); return; }
    }
    const m = S.materias[mat];
    let lista;
    if (modo === 'repaso') {
      // Primero las que fallaste, luego las que ya acertaste; si hay pocas, se completan con fáciles.
      const todas = BANCO[nivel][mat];
      lista = shuffle(todas.filter((q) => m.falladas[q.id])).concat(shuffle(todas.filter((q) => !m.falladas[q.id] && m.ok[q.id])));
      if (lista.length < 4) lista = lista.concat(shuffle(preguntasDe(mat, 'facil').filter((q) => lista.indexOf(q) < 0)));
    } else {
      const pool = preguntasDe(mat, dif);
      lista = shuffle(pool.filter((q) => !m.ok[q.id])).concat(shuffle(pool.filter((q) => m.ok[q.id])));
    }
    L = {
      mat, dif: dif || 'facil', modo, lista: lista.slice(0, CONFIG.LECCION_LEN), i: 0,
      aciertos: 0, respondidas: 0, xp: 0, banco: 0, topado: false, medallas: [],
      inicio: Date.now(), terminada: false, porVidas: false
    };
    prepararPregunta();
    ir('juego', { mat });
  }
  function prepararPregunta() {
    const q = L.lista[L.i];
    L.orden = shuffle(q.opciones.map((_, i) => i));
    L.sel = null; L.comprobado = false; L.pista = false; L.descartadas = [];
  }
  function elegir(pos) {
    if (!L || L.comprobado || L.descartadas.indexOf(pos) >= 0) return;
    L.sel = pos;
    $$('.opcion').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.pos) === pos)));
    $('[data-a="comprobar"]').disabled = false;
  }
  function usarPista() {
    if (!L || L.comprobado || L.pista) return;
    const q = L.lista[L.i];
    if (q.opciones.length < 4) return;
    const malas = shuffle(L.orden.map((idx, pos) => ({ idx, pos })).filter((o) => o.idx !== q.respuesta)).slice(0, 2);
    L.pista = true;
    L.descartadas = malas.map((o) => o.pos);
    malas.forEach((o) => { const b = $('.opcion[data-pos="' + o.pos + '"]'); b.disabled = true; b.setAttribute('aria-pressed', 'false'); });
    if (L.descartadas.indexOf(L.sel) >= 0) { L.sel = null; $('[data-a="comprobar"]').disabled = true; }
    $('[data-a="pista"]').disabled = true;
    toast('💡 Sanik quitó dos opciones incorrectas. Este acierto vale la mitad.');
  }
  function comprobar() {
    if (!L || L.comprobado || L.sel === null) return;
    L.comprobado = true; L.respondidas++; S.stats.respondidas++;
    const q = L.lista[L.i], m = S.materias[L.mat], ok = L.orden[L.sel] === q.respuesta;
    let r = null;
    if (ok) {
      L.aciertos++; S.stats.aciertos++;
      ses.combo++; ses.mejorCombo = Math.max(ses.mejorCombo, ses.combo);
      ses.tiempos.push(Date.now()); if (ses.tiempos.length > 10) ses.tiempos.shift();
      if (q.dificultad === 'dificil') ses.dificilesSeguidas++;
      const primera = !m.ok[q.id];
      const xp = Math.max(1, Math.round(q.xpBase * (primera ? 1 : CONFIG.FACTOR_REPETIDA) * (L.pista ? CONFIG.FACTOR_PISTA : 1) * multiplicador()));
      m.ok[q.id] = (m.ok[q.id] || 0) + 1;
      delete m.falladas[q.id];
      m.aciertos++; m.racha++; m.mejorRacha = Math.max(m.mejorRacha, m.racha);
      r = sumarPuntos(xp);
      L.xp += r.xp; L.banco += r.banco; if (r.topado) L.topado = true;
    } else {
      ses.combo = 0; ses.tiempos = []; ses.dificilesSeguidas = 0;
      m.errores++; m.racha = 0; m.falladas[q.id] = (m.falladas[q.id] || 0) + 1;
      if (L.modo !== 'repaso') perderVida();
    }
    revisarMedallas({ respondiendo: true });
    guardar();
    mostrarFeedback(ok, q, r);
  }
  function mostrarFeedback(ok, q, r) {
    $$('.opcion').forEach((b) => {
      const pos = Number(b.dataset.pos);
      b.disabled = true;
      if (L.orden[pos] === q.respuesta) b.classList.add('correcta');
      else if (pos === L.sel) b.classList.add('incorrecta');
    });
    $('#juego-acciones').hidden = true;
    $('.juego').classList.add('con-fb');
    const sinVidas = !ok && L.modo !== 'repaso' && S.vidas.n <= 0;
    const ultima = L.i + 1 >= L.lista.length;
    const fb = $('#feedback');
    fb.className = 'feedback ' + (ok ? 'ok' : 'mal');
    fb.innerHTML = ok
      ? '<div class="fb-cab"><span aria-hidden="true">✅</span><b>' + azar(FRASES_OK) + '</b><span class="fb-pts">+' + r.xp + ' XP' + (r.banco < r.xp ? ' · ' + r.banco + ' al banco' : '') + '</span></div><p>' + esc(q.explicacion) + '</p>' +
        '<button class="btn btn-bloque" data-a="continuar">' + (ultima ? 'Ver resultados' : 'Continuar') + '</button>'
      : '<div class="fb-cab"><span aria-hidden="true">❌</span><b>' + azar(FRASES_MAL) + '</b></div><p>Respuesta correcta: <b>' + esc(q.opciones[q.respuesta]) + '</b></p><p>' + esc(q.explicacion) + '</p>' +
        (sinVidas ? '<p><b>Te quedaste sin vidas ❤️</b></p>' : '') +
        '<button class="btn btn-rojo btn-bloque" data-a="continuar">' + (sinVidas || ultima ? 'Ver resultados' : 'Entendido') + '</button>';
    fb.hidden = false;
    const vj = $('#vidas-juego');
    if (vj && L.modo !== 'repaso') vj.textContent = '❤️ ' + S.vidas.n;
    if (ok) {
      Sonido.correcto(); vibrar(40); sanik('celebrate', 1300);
      flotar('+' + r.xp, $('.opcion.correcta'));
      if ([5, 10, 20].indexOf(ses.combo) >= 0) { confeti(); Sonido.racha(); toast('🔥 ¡Combo de ' + ses.combo + '! Multiplicador ×' + multiplicador(), 'oro'); }
    } else {
      Sonido.error(); vibrar([60, 40, 60]); sanik('sad', 1800);
    }
    procesarEventos();
    fb.querySelector('button').focus({ preventScroll: true });
  }
  function continuar() {
    if (!L || !L.comprobado || L.terminada) return;
    const sinVidas = L.modo !== 'repaso' && S.vidas.n <= 0;
    L.i++;
    if (L.i >= L.lista.length || sinVidas) { terminarLeccion(sinVidas && L.i < L.lista.length); return; }
    prepararPregunta();
    $('#vista').innerHTML = vJuego();

  function terminarLeccion(porVidas) {
    L.fin = Date.now();

    if (L.modo === 'repaso' && S.vidas.n < CONFIG.VIDAS_MAX) {
      S.vidas.n++; L.vidaGanada = true;
      if (S.vidas.n >= CONFIG.VIDAS_MAX) S.vidas.desde = Date.now();
    }
    if (extenderRacha()) {
      L.rachaExtendida = true;
      if ([7, 30, 100].indexOf(S.racha.actual) >= 0) emitir({ tipo: 'hito', n: S.racha.actual });
    }
    registrar('leccion', L.banco, MATERIAS[L.mat].corto + ' · ' + (L.modo === 'repaso' ? 'Repaso' : DIFICULTADES[L.dif].nombre) + ': ' + L.aciertos + '/' + L.respondidas + ' aciertos (+' + L.xp + ' XP)');
    revisarMedallas({});
    L.terminada = true;
    guardar(true);
    ir('resultados', { mat: L.mat }, { reemplazar: true });
  }
  function modalSinVidas(mat) {

  /* ===================== BANCO Y TIENDA ===================== */
  function canjear() {
    if (S.integridad === 'alterada') { toast('⚠️ Los canjes de este nivel están bloqueados', 'mal'); return; }
    if (disponibles() < CONFIG.PTS_POR_DECIMA) return;
    const seq = S.canjes.length + 1, fecha = hoyStr();
    const codigo = codigoCanje(nivel, seq, fecha, G.dispositivo);
    S.canjeados += CONFIG.PTS_POR_DECIMA;
    S.canjes.push({ seq, ts: Date.now(), fecha, pts: CONFIG.PTS_POR_DECIMA, decimas: 1, codigo });
    registrar('canje', -CONFIG.PTS_POR_DECIMA, 'Canje de 1 décima · ' + codigo);
    revisarMedallas({});
    guardar(true);
    pintar();
    abrirModal(sanikSVG('principal') + '<h2>🧾 Comprobante de décima</h2><p>' + NIVELES[nivel].nombre + ' · décima #' + seq + ' · ' + fechaCorta(fecha) + '</p>' +

  function comprar(k) {
    const costo = k === 'congelar' ? CONFIG.COSTO_CONGELAR : CONFIG.COSTO_VIDAS;
    if (disponibles() < costo) { toast('No tienes suficientes puntos disponibles', 'mal'); return; }
    actualizarVidas();
    if (k === 'congelar') {
      if (S.racha.congeladores >= CONFIG.MAX_CONGELADORES) return;
      S.racha.congeladores++;
    } else {
      if (S.vidas.n >= CONFIG.VIDAS_MAX) { toast('Tus vidas ya están llenas ❤️'); return; }
      S.vidas.n = CONFIG.VIDAS_MAX; S.vidas.desde = Date.now();
    }
    S.gastados += costo;
    registrar('tienda', -costo, k === 'congelar' ? 'Tienda: congelador de racha' : 'Tienda: recarga de vidas');
    guardar(true);
    Sonido.medalla();

    { c: ['desbloque', 'candado', 'bloquead', 'dificil', 'medio'], r: () => 'Cada materia tiene 3 dificultades. «Medio» se abre cuando dominas ' + CONFIG.DESBLOQUEO.medio + ' preguntas fáciles y «Difícil» cuando dominas ' + CONFIG.DESBLOQUEO.dificil + ' de nivel medio. Dominar = acertarla al menos una vez.' },
    { c: ['medalla', 'insignia', 'logro', 'trofeo'], r: () => 'Hay medallas de Bronce, Plata, Oro y Diamante por materia, y medallas especiales como Madrugador, Velocista o Sabio. Míralas todas en 🏅 Medallas.' },
    { c: ['colonia', 'liga', 'ranking', 'semana', 'puesto'], r: () => 'En la 🐜 Colonia compites cada semana con hormigas de práctica (son personajes de la app). Los 10 primeros suben de liga y los últimos 5 bajan. ¡Llega hasta la liga Diamante!' },

  ];
  const CHIPS = ['¿Cómo gano puntos?', '¿Cómo canjeo décimas?', '¿Qué es la racha?', '¿Cómo desbloqueo Difícil?', '¿Cómo dono un celular?', 'Dame un consejo', '¿Quién eres?'];
  const chat = [];

      const p = f.c.filter((c) => t.indexOf(c) >= 0).length;

  /* ===================== ACCIONES (delegación de eventos) ===================== */
  let materiaPendiente = null;
  const ACCIONES = {

    canjear: () => confirmar('¿Canjear 1,000 pts?', 'Recibirás un comprobante por 1 décima (0.1 punto) para mostrar a tu docente. No se puede deshacer.', 'Sí, canjear', canjear),
    comprar: (d) => {
      const costo = d.k === 'congelar' ? CONFIG.COSTO_CONGELAR : CONFIG.COSTO_VIDAS;
      confirmar(d.k === 'congelar' ? '¿Comprar un congelador?' : '¿Recargar tus vidas?', 'Usarás ' + fmt(costo) + ' pts que también podrías canjear por décimas.', 'Comprar', () => comprar(d.k));
    },
    verMedalla: (d) => verMedalla(d.id),
    asistente: abrirAsistente,
    preguntarSanik: (d) => preguntarSanik(d.q),
    cerrarModal,
    confirmarSi: () => { const f = accionPendiente; accionPendiente = null; cerrarModal(); if (f) f(); },
    instalar: () => {
      if (!eventoInstalar) return;
      eventoInstalar.prompt();
      eventoInstalar.userChoice.then(() => { eventoInstalar = null; pintar(); }, () => { eventoInstalar = null; });
    },
    reiniciar: () => confirmar('¿Borrar todo el progreso de ' + NIVELES[nivel].nombre + '?', 'Se borrarán puntos, décimas sin canjear, medallas, racha y comprobantes de este nivel. No se puede deshacer.', 'Sí, borrar', () => {
      borrarClave(KEYS[nivel]);
      S = nuevoNivel(nivel);
      ultimoPctXP = null;
      guardar(true);
      toast('Progreso de ' + NIVELES[nivel].nombre + ' reiniciado', 'ok');
      ir('materias');
    }, true),
    compartirResena: (d) => { const r = G.resenas[Number(d.i)]; if (r) compartir(textoResena(r)); },
    compartirTodas: () => compartir(G.resenas.map(textoResena).join('\n\n'))
  };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-a]');
    if (!t || t.disabled) return;
    const fn = ACCIONES[t.dataset.a];
    if (!fn) return;
    if (['elegir', 'comprobar', 'continuar'].indexOf(t.dataset.a) < 0) Sonido.click();
    fn(t.dataset, t, e);
  });
  document.addEventListener('change', (e) => {
    const t = e.target, k = t.dataset && t.dataset.ajuste;
    if (!k) return;
    if (k === 'sonido' || k === 'vibracion') {
      G.ajustes[k] = t.checked;
      if (k === 'sonido' && t.checked) { Sonido.activar(); Sonido.correcto(); }
      if (k === 'vibracion' && t.checked) vibrar(60);
    } else if (k === 'tema') { G.ajustes.tema = t.value; aplicarTema(); }
    else if (k === 'meta') { S.meta.objetivo = Number(t.value); }
    else if (k === 'nombre') { G.nombre = t.value.trim().slice(0, 20); }
    guardar();
    toast('Guardado ✓', 'ok');
  });
  document.addEventListener('submit', (e) => {
    const f = e.target, tipo = f.dataset && f.dataset.f;
    if (!tipo) return;
    e.preventDefault();
    if (tipo === 'verificar') {
      const r = verificarCodigo(f.elements.codigo.value), out = $('#verif-res');
      out.textContent = r.msg;
      out.className = 'verif-res ' + (r.ok ? 'ok' : 'mal');
      if (r.ok) Sonido.correcto(); else Sonido.error();
    } else if (tipo === 'asistente') {
      const q = f.elements.q.value.trim();
      if (q) { f.elements.q.value = ''; preguntarSanik(q); }
    } else if (tipo === 'resena') {
      const est = f.querySelector('input[name="estrellas"]:checked'), texto = f.elements.texto.value.trim();
      if (!est) { toast('Elige de 1 a 5 estrellas ⭐', 'mal'); return; }
      if (texto.length < 3) { toast('Escribe tu idea u opinión', 'mal'); return; }
      G.resenas.push({ ts: Date.now(), estrellas: Number(est.value), categoria: f.elements.categoria.value, texto: texto.slice(0, 500), nombre: f.elements.nombre.value.trim().slice(0, 30) });
      if (G.resenas.length > 50) G.resenas.shift();
      guardar(true);
      pintar();
      toast('¡Gracias! Tu idea quedó guardada 🐜', 'ok');
      Sonido.correcto();
      sanik('celebrate', 1400);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalAbierto) { cerrarModal(); return; }
    if (vista !== 'juego' || modalAbierto || !L || L.terminada) return;
    if (/^[1-4]$/.test(e.key)) elegir(Number(e.key) - 1);
    else if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button, input, textarea, select'))) {
      e.preventDefault();
      if (L.comprobado) continuar(); else comprobar();
    }
  });

  /* ===================== TEMA, RED Y PWA ===================== */
  function aplicarTema() {
    const t = G.ajustes.tema, html = document.documentElement;
    if (t === 'claro') html.setAttribute('data-theme', 'light');
    else if (t === 'oscuro') html.setAttribute('data-theme', 'dark');
    else html.removeAttribute('data-theme');
  }
  function pintarRed() {
    const p = $('.punto-red');
    if (!p) return;
    p.classList.toggle('on', navigator.onLine);
    p.classList.toggle('off', !navigator.onLine);
    p.setAttribute('aria-label', navigator.onLine ? 'Con internet' : 'Sin internet');
  }
  window.addEventListener('offline', () => { toast('📴 Sin internet: tu progreso se guarda en este teléfono'); pintarRed(); });
  window.addEventListener('online', () => { toast('📶 Conectado de nuevo', 'ok'); pintarRed(); });
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    eventoInstalar = e;
    if (vista === 'inicio' || vista === 'mas') pintar();
  });
  window.addEventListener('appinstalled', () => { eventoInstalar = null; toast('📲 ¡CTRL+R quedó instalada!', 'ok'); });
  // Service Worker y manifest solo funcionan servidos por http(s) (no al abrir el archivo directamente).
  if (/^https?:$/.test(location.protocol)) {
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'manifest.webmanifest';
    document.head.appendChild(link);
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* sin SW: la app sigue funcionando */ }));
  }

  /* ===================== INICIO ===================== */
  // TODO: Modo multijugador local (Bluetooth/WebRTC) -> nueva pantalla "Duelo".
  // TODO: Exportar certificado PDF al completar el 100 % del nivel.
  // TODO: Modo profesor: panel con códigos de clase y registro de comprobantes ya usados.
  // TODO: Más idiomas (kaqchikel, k'iche', inglés) -> i18n simple.
  function iniciar() {
    G = cargarGlobal();
    aplicarTema();
    escribir('ctrlr_prueba', '1');
    borrarClave('ctrlr_prueba');
    const pm = new URLSearchParams(location.search).get('materia');
    history.replaceState({ v: 'inicio', p: {} }, '', location.pathname);
    if (pm && MATERIAS[pm] && G.ultimoNivel) entrarYMostrar(G.ultimoNivel, pm);
    else { if (pm && MATERIAS[pm]) materiaPendiente = pm; pintar(); }
    if (!almacenOK) toast('⚠️ Este navegador no permite guardar: tu progreso se perderá al cerrar la app', 'mal');
  }
  iniciar();
})();
</script>
